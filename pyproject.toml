[project]
name = "ghes-openapi-mcp"
version = "0.1.0"
description = "MCP server that searches a GitHub Enterprise Server repo and returns matching OpenAPI specs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ghes-openapi-mcp = "ghes_openapi_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghes_openapi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
